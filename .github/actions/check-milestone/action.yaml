name: Check milestone
description: Decides whether a real release may happen, and checks the milestone if so
inputs:
  milestone:
    description: Milestone for this release. Only required when running on main.
    required: false
  github_token:
    description: Secret GitHub token
    required: true
outputs:
  outcome:
    description: >-
      `success` when a release may proceed, `failure` when the milestone is not
      releasable, and `skipped` when this is not a release branch. The action
      exits non-zero on `failure`, so a caller normally only ever observes
      `success` or `skipped`.
    value: ${{ steps.result.outputs.outcome }}
runs:
  using: composite
  steps:
    # The branch rule lives here rather than in the calling workflow, so that
    # "is this a real release?" is answered in exactly one place. Callers gate
    # their release and deploy steps on the outcome and need no branch
    # conditions of their own.
    - name: Determine whether this is a release
      id: applicable
      shell: bash
      env:
        MILESTONE: ${{ inputs.milestone }}
      run: |
        if [ "${{ github.ref }}" != "refs/heads/main" ]; then
          echo "Not on main (${{ github.ref_name }}) - rehearsal only, no release will be made."
          echo "applicable=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$MILESTONE" ]; then
          echo "A milestone is required when releasing from main." >&2
          exit 1
        fi
        echo "applicable=true" >> "$GITHUB_OUTPUT"

    - name: Get closed issues for milestone
      id: closed_issues
      if: steps.applicable.outputs.applicable == 'true'
      uses: octokit/graphql-action@v2.x
      env:
        MILESTONE: ${{ inputs.milestone }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      with:
        query: |
          query {
            search(first: 1, type: ISSUE, query: "repo:${{ github.repository_owner }}/${{ github.event.repository.name }} milestone:${{ env.MILESTONE }} state:closed") {
              issueCount
            }
          }

    - name: Get open issues for milestone
      id: open_issues
      if: steps.applicable.outputs.applicable == 'true'
      uses: octokit/graphql-action@v2.x
      env:
        MILESTONE: ${{ inputs.milestone }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      with:
        query: |
          query {
            search(first: 1, type: ISSUE, query: "repo:${{ github.repository_owner }}/${{ github.event.repository.name }} milestone:${{ env.MILESTONE }} state:open") {
              issueCount
            }
          }

    - name: Get current major version number
      id: majorvers
      if: steps.applicable.outputs.applicable == 'true'
      uses: ashley-taylor/regex-property-action@master
      env:
        MILESTONE: ${{ inputs.milestone }}
      with:
        value: ${{ env.MILESTONE }}
        regex: (\d+)\.\d+\.\d+
        replacement: "$1"

    - name: Get current minor version number
      id: minorvers
      if: steps.applicable.outputs.applicable == 'true'
      uses: ashley-taylor/regex-property-action@master
      env:
        MILESTONE: ${{ inputs.milestone }}
      with:
        value: ${{ env.MILESTONE }}
        regex: \d+\.(\d+)\.\d+
        replacement: "$1"

    - name: Get current patch version number
      id: patchvers
      if: steps.applicable.outputs.applicable == 'true'
      uses: ashley-taylor/regex-property-action@master
      env:
        MILESTONE: ${{ inputs.milestone }}
      with:
        value: ${{ env.MILESTONE }}
        regex: \d+\.\d+\.(\d+)
        replacement: "$1"

    - name: Check if releasenotes exists
      id: releasenotes
      if: steps.applicable.outputs.applicable == 'true'
      shell: bash
      run: |
        if [ -f "docs/content/introduction/releasenotes/${{ steps.majorvers.outputs.value }}/${{ steps.minorvers.outputs.value }}.en.md" ]; then
          echo "file_exists=true" >> $GITHUB_OUTPUT
        else
          echo "file_exists=false" >> $GITHUB_OUTPUT
        fi

    # Guarded, because it reads the GraphQL responses through fromJSON. Those
    # outputs are empty strings when the steps above were skipped, and
    # fromJSON('') is an expression error rather than a falsy value.
    - name: Set outcome
      id: outcome
      if: steps.applicable.outputs.applicable == 'true'
      shell: bash
      run: |
        echo has closed issues      : ${{ fromJSON(steps.closed_issues.outputs.data).search.issueCount > 0 }}
        echo   count                : ${{ fromJSON(steps.closed_issues.outputs.data).search.issueCount }}
        echo has all issues closed  : ${{ fromJSON(steps.open_issues.outputs.data).search.issueCount == 0 }}
        echo   count                : ${{ fromJSON(steps.open_issues.outputs.data).search.issueCount }}
        echo has releasenotes       : ${{ steps.releasenotes.outputs.file_exists }}
        if [[ \
          ${{ fromJSON(steps.closed_issues.outputs.data).search.issueCount }} -gt 0 && \
          ${{ fromJSON(steps.open_issues.outputs.data).search.issueCount }} -eq 0 && \
          ${{ steps.releasenotes.outputs.file_exists == 'true' }} \
        ]]; then
          echo "outcome=success" >> $GITHUB_OUTPUT
        else
          echo "outcome=failure" >> $GITHUB_OUTPUT
        fi

    # Unguarded, so the skipped case is reported too. It only interpolates
    # plain strings, which are safe to read from a step that did not run.
    - name: Report outcome
      id: result
      shell: bash
      run: |
        if [ "${{ steps.applicable.outputs.applicable }}" != "true" ]; then
          OUTCOME=skipped
        else
          OUTCOME="${{ steps.outcome.outputs.outcome }}"
        fi
        echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
        echo "outcome                : $OUTCOME"
        if [ "$OUTCOME" = "failure" ]; then
          exit 1
        fi
