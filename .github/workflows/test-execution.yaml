name: test-execution

# Validates a theme change against the test suite in hugo-theme-relearn-infra.
# The suite is not in this repository because it is not shipped to theme users.

# Runs on every branch and every pull request. It never releases, deploys or
# publishes anything, and it is deliberately not hand-triggerable: a test
# result should always correspond to a commit somebody actually pushed.
on:
  push:
  pull_request:
  # Called by version-release, so that a release cannot happen on a red suite.
  # This is not a manual trigger - it only fires as part of that workflow.
  workflow_call:

# Declared rather than inherited, so the workflow does not depend on a
# repository setting that differs between an old repository and a new one.
permissions:
  contents: read

jobs:
  test:
    name: hugo ${{ matrix.hugo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo: [min, latest]
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4
        with:
          path: theme

      # A change spanning both repositories is reviewed as a pair of
      # same-named branches. Everything else runs against infra main.
      #
      # The sibling is derived from this repository rather than named, so a
      # fork or a throwaway `test-` copy of the pair stays inside itself
      # instead of silently reaching into the original.
      - name: Pick infra repository and branch
        id: pick
        shell: bash
        run: |
          SIBLING="${GITHUB_REPOSITORY}-infra"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads \
               "https://github.com/${SIBLING}" "$BRANCH" >/dev/null 2>&1; then
            REF="$BRANCH"
          else
            REF=main
          fi
          echo "repo=$SIBLING" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using $SIBLING branch $REF"

      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pick.outputs.repo }}
          ref: ${{ steps.pick.outputs.ref }}
          path: infra

      # Referenced through the checkout rather than by @main, so that a
      # matching infra branch supplies its own version of the action too.
      # GitHub does not allow expressions in `uses`, so this is also the only
      # way to follow the branch chosen above.
      - name: Run tests
        uses: ./infra/.github/actions/run-test
        with:
          theme_dir: theme
          infra_dir: infra
          hugo: ${{ matrix.hugo }}
