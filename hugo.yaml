module:
  hugoVersion:
    min: '0.166.0'

mediaTypes:
  text/javascript:
    suffixes:
      - js

outputFormats:
  print:
    name: print
    baseName: index.print
    isHTML: true
    mediaType: text/html
    permalinkable: false
    noUgly: true

  source:
    name: source
    baseName: index.source
    isHTML: false
    mediaType: text/markdown
    permalinkable: false
    noUgly: true

  # unused since 7.0.0 but left in here to generate warnings
  search:
    name: search
    baseName: index.searchindex
    isHTML: true
    mediaType: text/html
    permalinkable: false
    noUgly: true

  # unused since 7.0.0 but left in here to generate warnings
  searchpage:
    name: searchpage
    baseName: index.searchpage
    isHTML: true
    mediaType: text/html
    permalinkable: false
    noUgly: true

params:
  relearn:
    dependencies:
      math:
        name: Math
      # loaded by `math`, whose loader must run first; loaders run in the
      # sorted order of the keys, not in the order written here, and `math`
      # sorts first as it is a prefix of `mathkatex`
      mathkatex:
        name: MathKatex
      mermaid:
        name: Mermaid
      openapi:
        name: OpenApi
      search:
        name: Search
      theme:
        name: Theme
