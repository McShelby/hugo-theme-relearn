# Every third-party resource this project uses, declared once.
#
# Read by the credits page, which renders from it instead of being kept by
# hand; by the CycloneDX SBOM at `sbom.cdx.json`, generated from it; and by the
# drift check in the infra suite, which fails when a vendored directory holds
# files no entry claims, or an entry claims files that are gone.
#
# Only `scope = 'theme'` reaches the SBOM - that is what a site using the theme
# publishes. `docs`, `dev` and `build` exist for the credits page; putting them
# in the SBOM would misdescribe what a user serves.
#
# `requires` names the components another one depends on, by their `name`. It
# becomes the dependency graph in the SBOM and the nesting on the credits page:
# a component something requires counts as having come along with it, so it
# hangs off that component rather than off the theme, and a reader can tell
# what the theme calls from what merely came along.
#
# `extends` names the one component another only runs inside - a plugin its
# engine, an extension its editor, an action its platform. The credits page
# nests the extension beneath that host, and the SBOM records its dependency on
# it. Neither may also require the other.
#
# `paths` are repository-relative with forward slashes and claim a directory or
# a single file. The longest matching prefix wins, which is how one directory
# holds several components: `assets/js/lunr` is Lunr Languages, and the one
# file `assets/js/lunr/lunr.min.js` inside it is Lunr.
#
# Below each vendor root - `VENDOR_ROOTS` in the infra repository's
# `tools/sbom/declaration.js` holds them - a subdirectory is third-party and a
# flat file is ours, the convention `.prettierignore` already encodes wherever
# it does not skip a root whole. Every file below such a subdirectory needs
# an entry here or under `[[own]]`; a flat file needs none, and declaring one
# is rejected. `assets/css/nucleus.css` is the one judgement call: it arrived
# with the Learn theme, carries no licence header and names no upstream, and
# years of edits have left little of whatever it once was. It is treated as
# ours.
#
# When you vendor an update, change `version` in the same commit that changes
# the files. Nothing can re-derive it afterwards: a version is knowable at the
# moment of vendoring and at no other time.

# ------------------------------------------------------------------

