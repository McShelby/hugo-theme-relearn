# -------------------------------------------------------------------- own
#
# Files that sit inside a vendored directory but are this project's own work.
# Without these the drift check could not tell a first-party file apart from a
# vendored one that nobody declared.

[[own]]
  path = 'assets/js/lunr/lunr.en.min.js'
  reason = 'English needs no stemmer - Lunr has one built in. The stub exists so the adapter can load a language file for every language uniformly.'

[[own]]
  path = 'docs/assets/js/lunr/lunr.art.min.js'
  reason = 'Local to the documentation site. The Piratish translation uses `art-x-pir`, which the search adapter reduces to `art`, and without this file the language drops out of the index.'

[[own]]
  path = 'exampleSite/assets/js/lunr/lunr.art.min.js'
  reason = 'The same stub as the one under `docs`, for the same reason. Each site carries its own copy because a Hugo site cannot reach an asset in another.'
