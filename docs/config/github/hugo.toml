# Configuration to release this site on GitHub Pages.

# To use run `hugo -e github` or `hugo server -e github` from the `docs` directory

# For usual GH pages, your website resides in a subdirectory
# making it necessary to disable headless server mode
baseURL = 'https://mcshelby.github.io/hugo-theme-relearn/'
relativeURLs = false

[params]
  editURL = 'https://github.com/McShelby/hugo-theme-relearn/edit/main/docs/content/${FilePath}'

  # We already checked during development..
  urlExternalCheck = false

  # Some stuff to ignore that is not available in this environment.
  urlIgnoreCheck = [
    'hero.png',
    'exampleSite'
  ]
