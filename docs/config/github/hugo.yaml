# Configuration to release this site on GitHub Pages.

# To use run `hugo -e github` or `hugo server -e github` from the `docs` directory

# For usual GH pages, your website resides in a subdirectory
# making it necessary to disable headless server mode
baseURL: https://mcshelby.github.io/hugo-theme-relearn/
relativeURLs: false

# the released site shows the Markdown and source code of every page
outputs:
  # `print` - activate the themes feature to print whole chapters or leaf pages
  # `markdown` - activate the themes feature to show the Markdown of a page
  # `source` - activate the themes feature to show the source code of a page
  home:
    - html
    - rss
    - print
    - markdown
    - source
  section:
    - html
    - rss
    - print
    - markdown
    - source
  page:
    - html
    - print
    - markdown
    - source
  taxonomy:
    - html
    - rss
    - print
    - markdown
    - source
  term:
    - html
    - rss
    - print
    - markdown
    - source

params:
  editURL: https://github.com/McShelby/hugo-theme-relearn/edit/main/docs/content/${FilePath}

  # We already checked during development..
  urlExternalCheck: false

  # Some stuff to ignore that is not available in this environment.
  urlIgnoreCheck:
    - hero.png
    - exampleSite
