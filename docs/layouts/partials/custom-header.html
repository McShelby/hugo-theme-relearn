
    <style>
      /* image effects */
      #R-body img.bg-white {
        background-color: white;
      }
      /* the GitHub buttons render into a closed shadow root with their own colors, so only a
         filter on their host can tint them to the variant */
      :root[data-r-theme-variant^='tome-'] .github-buttons {
        filter: sepia(0.6) brightness(0.95);
      }
    </style>
